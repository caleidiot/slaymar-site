name: Snapshot comps (debug)
on:
  push:
    branches: [main]
    paths: [".github/workflows/snapshot.yml"]
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p debug
          UA="Mozilla/5.0 (compatible; slaymar-site/1.0)"
          curl -sSL -A "$UA" "https://websites.mygameday.app/assoc_page.cgi?c=0-10486-0-664405-0&a=COMPS" -o debug/comps.html
          curl -sSL -A "$UA" "https://websites.mygameday.app/team_info.cgi?id=26983581&client=0-10486-0-664405-0&compID=664405" -o debug/team.html
          git config user.name "slaymar-bot"; git config user.email "slaymar-bot@users.noreply.github.com"
          git add debug; git commit -m "Debug snapshot" || true; git push
