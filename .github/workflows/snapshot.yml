name: Snapshot source pages (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snapshot.yml"]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch raw pages
        run: |
          mkdir -p debug
          UA="Mozilla/5.0 (compatible; slaymar-site/1.0)"
          B="https://websites.mygameday.app"
          C="0-10486-0-664405-0"
          curl -sSL -A "$UA" "$B/team_info.cgi?id=26983581&client=$C&compID=664405" -o debug/team.html
          curl -sSL -A "$UA" "$B/team_info.cgi?c=0-10486-159484-664405-26983581&a=SFIX" -o debug/team_sfix.html
          curl -sSL -A "$UA" "$B/comp_info.cgi?c=$C&pool=1&a=LADDER" -o debug/ladder.html
          curl -sSL -A "$UA" "$B/comp_info.cgi?a=ROUND&round=-1&client=$C&pool=1" -o debug/round_all.html
          curl -sSL -A "$UA" "$B/assoc_page.cgi?c=$C&a=COMPS" -o debug/comps.html
          curl -sSL -A "$UA" "$B/round_info.cgi?action=MATCH&fixture=73005332&c=0-10486-159484-664405-26983581&pool=0" -o debug/match.html
          curl -sSL -A "$UA" "https://www.youtube.com/feeds/videos.xml?channel_id=UC_xn1ezjoM-ticFsGNraSig" -o debug/youtube.xml
          ls -la debug
      - name: Commit
        run: |
          git config user.name "slaymar-bot"
          git config user.email "slaymar-bot@users.noreply.github.com"
          git add debug
          git commit -m "Debug snapshot of source pages" || echo "no changes"
          git push
