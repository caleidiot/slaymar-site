name: Update data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 3 hours (UTC). Thursday-night results usually land within a day or two.
    - cron: "17 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape GameDay and YouTube
        env:
          MVP_SUMMARY_URL: ${{ secrets.MVP_SUMMARY_URL }}
        run: npm run scrape -- ${{ contains(github.event.head_commit.message, '[backfill]') && '--backfill' || '' }}
      - name: Commit data if changed
        run: |
          git config user.name "slaymar-bot"
          git config user.email "slaymar-bot@users.noreply.github.com"
          git add data
          # Ignore timestamps so we only commit real changes.
          if git diff --cached --quiet -I '"updated":' -I '"archived":'; then
            echo "No data changes (deploying with fresh timestamp only)"
            git reset -q
          else
            git commit -m "Update match data"
            git push
          fi
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          # Cache-bust: every deploy gets new file URLs so browsers fetch the latest code.
          V="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          sed -i "s#href=\"styles.css\"#href=\"styles.css?v=$V\"#; s#src=\"app.js\"#src=\"app.js?v=$V\"#" _site/index.html
          cp favicon-32.png icon-192.png icon-512.png apple-touch-icon.png og.png manifest.webmanifest _site/ 2>/dev/null || true
          cp -r assets _site/ 2>/dev/null || true
          cp -r data/. _site/data/
          [ -f CNAME ] && cp CNAME _site/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
